name: Review AI Artist

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: review-ai-artist
  cancel-in-progress: false

jobs:
  review:
    if: ${{ github.event.action == 'opened' || github.event.label.name == 'accepted' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: lts

      - name: Process issue
        id: review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBMITHUB_API_KEY: ${{ secrets.SUBMITHUB_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          deno run --allow-read --allow-write --allow-env --allow-net .github/scripts/review.js

      - name: Commit and push changes
        if: steps.review.outputs.artist_id
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add SpotifyAiArtists.csv
          git commit -m "Add AI artist: \"${{ steps.review.outputs.artist_name }}\" (ID: ${{ steps.review.outputs.artist_id }}) fixes #${{ github.event.issue.number }}" || exit 0

          # Reconcile with any commits that landed on main since checkout,
          # relying on the built-in `merge=union` driver declared in
          # .gitattributes for SpotifyAiArtists.csv (no custom driver needed).
          for i in 1 2 3 4 5; do
            git fetch origin main
            git merge --no-edit origin/main && break
            echo "Merge attempt $i failed, retrying..."
            sleep $((RANDOM % 5 + 1))
          done

          # Push with retry in case another run landed a commit in the meantime.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded."
              break
            fi
            echo "Push attempt $i failed, fetching and retrying..."
            git fetch origin main
            git merge --no-edit origin/main
            sleep $((RANDOM % 5 + 1))
          done
